name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [ Release ]

    env:
      BUILD_DIR: build
      QT_ARCH: win64_msvc2019_64
      QWT_VERSION: 6.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenAL (openal-soft) via vcpkg
        shell: pwsh
        run: |
          vcpkg install openal-soft --triplet x64-windows
          vcpkg integrate install

      - name: Build Qwt from source (against installed Qt)
        shell: pwsh
        run: |
          $qwtSrc = "$env:RUNNER_TEMP\qwt"
          $zip = "$env:RUNNER_TEMP\qwt.zip"
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/qwt/qwt/$env:QWT_VERSION/qwt-$env:QWT_VERSION.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $qwtSrc -Force
          $src = "$qwtSrc\qwt-$env:QWT_VERSION"
          Push-Location $src
          try {
            & "$env:QT_ROOT_DIR\bin\qmake.exe" qwt.pro
            nmake /nologo
          } finally {
            Pop-Location
          }
          Write-Host "Qwt built at $src"
          if (-not (Test-Path "$src\lib\qwt.dll") -or -not (Test-Path "$src\lib\qwt.lib") -or -not (Test-Path "$src\include\qwt_plot.h")) {
            Write-Error "Qwt build did not produce the expected artifacts"
            exit 1
          }
          # Remember the location for later steps
          "QWT_SRC=$src" | Out-File -FilePath "$env:GITHUB_ENV" -Append

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DQWT_DIR="$env:QWT_SRC" `
            -DOPENALDIR="C:\vcpkg\installed\x64-windows"

      - name: Build
        shell: pwsh
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.config }}

      - name: Deploy runtime (windeployqt) and bundle Qwt / OpenAL
        shell: pwsh
        run: |
          $exeDir = "${{ env.BUILD_DIR }}\${{ matrix.config }}"
          $windeploy = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          & $windeploy --release $exeDir\Soundlab.exe
          Copy-Item "$env:QWT_SRC\lib\qwt.dll" $exeDir -Force
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\OpenAL32.dll" $exeDir -Force
          # qwt.dll links Qt5OpenGL, which windeployqt does not resolve via the exe only.
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt5OpenGL.dll" $exeDir -Force

      - name: Smoke test (launch the executable)
        shell: pwsh
        run: |
          $exe = "${{ env.BUILD_DIR }}\${{ matrix.config }}\Soundlab.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "Application exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Application launched successfully."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soundlab-${{ matrix.config }}
          path: ${{ env.BUILD_DIR }}\${{ matrix.config }}