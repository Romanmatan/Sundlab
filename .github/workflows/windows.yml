name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [ Release ]

    env:
      BUILD_DIR: build
      QT_ARCH: win64_msvc2019_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Patch Qt headers for modern MSVC STL (stdext removal)
        shell: pwsh
        run: |
          $h = "$env:QT_ROOT_DIR\include\QtCore\qcompilerdetection.h"
          $c = Get-Content $h -Raw
          $checkedOld = '#  define QT_MAKE_CHECKED_ARRAY_ITERATOR(x, N) stdext::make_checked_array_iterator(x, size_t(N)) // Since _MSC_VER >= 1500'
          $uncheckedOld = '#  define QT_MAKE_UNCHECKED_ARRAY_ITERATOR(x) stdext::make_unchecked_array_iterator(x) // Since _MSC_VER >= 1800'
          $nl = [Environment]::NewLine
          $checkedNew = '#  if defined(_ITERATOR_DEBUG_LEVEL) && _ITERATOR_DEBUG_LEVEL' + $nl `
            + '#    define QT_MAKE_CHECKED_ARRAY_ITERATOR(x, N) stdext::make_checked_array_iterator(x, size_t(N)) // Since _MSC_VER >= 1500' + $nl `
            + '#  else' + $nl `
            + '#    define QT_MAKE_CHECKED_ARRAY_ITERATOR(x, N) (x)' + $nl `
            + '#  endif'
          $uncheckedNew = '#  if defined(_ITERATOR_DEBUG_LEVEL) && _ITERATOR_DEBUG_LEVEL' + $nl `
            + '#    define QT_MAKE_UNCHECKED_ARRAY_ITERATOR(x) stdext::make_unchecked_array_iterator(x) // Since _MSC_VER >= 1800' + $nl `
            + '#  else' + $nl `
            + '#    define QT_MAKE_UNCHECKED_ARRAY_ITERATOR(x) (x)' + $nl `
            + '#  endif'
          if ($c.Contains($checkedOld)) {
            $c = $c.Replace($checkedOld, $checkedNew)
            $c = $c.Replace($uncheckedOld, $uncheckedNew)
            [System.IO.File]::WriteAllText($h, $c)
            Write-Host "Patched qcompilerdetection.h for stdext removal"
          } else {
            Write-Host "Header not in expected state; skipping patch"
          }

      - name: Install OpenAL (openal-soft) via vcpkg
        shell: pwsh
        run: |
          Remove-Item Env:\VCPKG_ROOT -ErrorAction SilentlyContinue
          $vcpkg = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          if (-not $vcpkg) {
            Write-Host "vcpkg.exe not on PATH; trying VCPKG_INSTALLATION_ROOT"
            $root = $env:VCPKG_INSTALLATION_ROOT
            if ([string]::IsNullOrWhiteSpace($root)) { Write-Error "Could not locate vcpkg"; exit 1 }
            $vcpkgExe = Join-Path $root "vcpkg.exe"
          } else {
            $vcpkgExe = $vcpkg.Source
          }
          if (-not (Test-Path $vcpkgExe)) { Write-Error "vcpkg executable missing: $vcpkgExe"; exit 1 }
          $attempt = 0
          $done = $false
          while (-not $done -and $attempt -lt 4) {
            $attempt++
            & $vcpkgExe install openal-soft --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { $done = $true }
            elseif ($attempt -lt 4) { Write-Host "vcpkg install attempt $attempt failed; retrying in 5s..."; Start-Sleep -Seconds 5 }
          }
          if (-not $done) { Write-Error "vcpkg install failed after $attempt attempts"; exit 1 }
          $base = Split-Path $vcpkgExe -Parent
          Write-Host "vcpkg base: $base"
          # Locate the installed include dir and import library (do not assume one layout).
          $alInc = $null
          $alLib = $null
          Get-ChildItem -Path $base -Directory -Filter "*windows*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $tryInc = Join-Path $_.FullName "include"
            if (-not $alInc -and (Test-Path (Join-Path $tryInc "AL\al.h"))) { $alInc = $tryInc }
            $tryLib = Join-Path $_.FullName "lib"
            if (-not $alLib) {
              $libs = Get-ChildItem -Path $tryLib -Filter "*.lib" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "OpenAL|openal" }
              if ($libs) { $alLib = $libs[0].FullName }
            }
          }
          if (-not $alInc -or -not $alLib) {
            Write-Host "Searched under $base"
            Get-ChildItem -Path $base -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "al\.h|OpenAL" } | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "OpenAL include/lib not located under $base"
            exit 1
          }
          "OPENAL_INCLUDE_DIR=$alInc" | Out-File -FilePath "$env:GITHUB_ENV" -Append
          "OPENAL_LIBRARY=$alLib" | Out-File -FilePath "$env:GITHUB_ENV" -Append
          $alBin = Join-Path (Split-Path $alLib -Parent | Split-Path -Parent) "bin"
          if (-not (Test-Path (Join-Path $alBin "OpenAL32.dll"))) {
            $dll = Get-ChildItem (Split-Path $alLib -Parent | Split-Path -Parent) -Filter "OpenAL*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) { $alBin = $dll.DirectoryName }
          }
          "OPENAL_BIN_DIR=$alBin" | Out-File -FilePath "$env:GITHUB_ENV" -Append
          Write-Host "OpenAL include: $alInc"
          Write-Host "OpenAL library: $alLib"
          Write-Host "OpenAL bin: $alBin"

      - name: Build Qwt from source (against installed Qt)
        shell: pwsh
        run: |
          $qwtBase = "$env:RUNNER_TEMP\qwt"
          git clone --depth 1 --branch v6.3.0 https://git.code.sf.net/p/qwt/git "$qwtBase"
          Push-Location "$qwtBase\src"
          try {
            & "$env:QT_ROOT_DIR\bin\qmake.exe" src.pro
            nmake /nologo release
          } finally {
            Pop-Location
          }
          # Assemble a clean include + lib layout for FindQwt.cmake
          $ErrorActionPreference = 'Stop'
          $qwtLayout = "$env:RUNNER_TEMP\qwt-layout"
          $inc = "$qwtLayout\include"
          $libd = "$qwtLayout\lib"
          [System.IO.Directory]::CreateDirectory($inc) | Out-Null
          [System.IO.Directory]::CreateDirectory($libd) | Out-Null
          Copy-Item "$qwtBase\src\*.h" $inc -Force
          Copy-Item "$qwtBase\lib\qwt.dll", "$qwtBase\lib\qwt.lib" $libd -Force
          if (-not (Test-Path "$inc\qwt_plot.h") -or -not (Test-Path "$libd\qwt.dll") -or -not (Test-Path "$libd\qwt.lib")) {
            Write-Error "Qwt build did not produce the expected artifacts"
            exit 1
          }
          Write-Host "Qwt installed to $qwtLayout"
          "QWT_DIR=$qwtLayout" | Out-File -FilePath "$env:GITHUB_ENV" -Append

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DQWT_DIR="$env:QWT_DIR" `
            -DOPENAL_INCLUDE_DIR="$env:OPENAL_INCLUDE_DIR" `
            -DOPENAL_LIBRARY="$env:OPENAL_LIBRARY"

      - name: Build
        shell: pwsh
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.config }}

      - name: Deploy runtime (windeployqt) and bundle Qwt / OpenAL
        shell: pwsh
        run: |
          $exeDir = "${{ env.BUILD_DIR }}\${{ matrix.config }}"
          $windeploy = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          & $windeploy --release $exeDir\Soundlab.exe
          Copy-Item "$env:QWT_DIR\lib\qwt.dll" $exeDir -Force
          Copy-Item "$env:OPENAL_BIN_DIR\OpenAL32.dll" $exeDir -Force
          # qwt.dll links Qt5OpenGL, which windeployqt does not resolve via the exe only.
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt5OpenGL.dll" $exeDir -Force

      - name: Smoke test (launch the executable)
        shell: pwsh
        run: |
          $exe = "${{ env.BUILD_DIR }}\${{ matrix.config }}\Soundlab.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "Application exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Application launched successfully."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soundlab-${{ matrix.config }}
          path: ${{ env.BUILD_DIR }}\${{ matrix.config }}
